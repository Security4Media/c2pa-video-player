server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Fixture videos are mounted in at `docker run` time and may be absent;
    # return a real 404 instead of falling through to index.html.
    location /mp4s/ {
        try_files $uri =404;
    }
}
